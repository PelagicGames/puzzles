<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>Playground | Light Discs</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-shell">
    <a class="back-link" href="./index.html" aria-label="Back to main menu">&#8592; Menu</a>
    <header class="page-header">
      <div class="page-title">
        <p class="eyebrow">Light Discs</p>
        <h1>Playground</h1>
      </div>
      <div class="page-guidance">
        <p class="page-help">Overlap discs to match the colour and pattern targets. Use the curved arrows to rotate a free triangle by 60&deg;.</p>
        <p class="status-message" id="success-indicator" role="status" aria-live="polite" hidden>Success: targets matched</p>
        <button class="action-button" id="reset-button" type="button">Reset</button>
      </div>
    </header>

    <div class="interaction-stage">
      <div class="match-summary">
        <p class="progress-indicator" id="progress-indicator" aria-live="polite"></p>
        <p class="match-key"><span class="match-dot is-matched"></span> Matched <span class="match-dot is-unmatched"></span> Not matched</p>
      </div>
      <svg class="interaction-board" viewBox="0 0 1000 950" role="application" aria-label="Triangle matching playground">
        <g aria-label="Fixed black triangle" transform="translate(500 440)">
          <path class="fixed-triangle triangle-path"></path>
        </g>
        <g id="pieces"></g>
        <g class="fixed-discs-layer">
          <g class="fixed-discs" transform="translate(500 440)"></g>
        </g>
        <foreignObject class="filter-render" x="0" y="0" width="1000" height="950">
          <canvas id="filter-canvas" xmlns="http://www.w3.org/1999/xhtml" width="1000" height="950"></canvas>
        </foreignObject>
        <g class="piece-disc-outlines" id="piece-discs"></g>
        <g class="target-display" transform="translate(500 440)" aria-label="Target patterns">
          <g id="target-discs"></g>
        </g>
      </svg>
      <aside class="target-inspector" id="target-inspector" role="tooltip" hidden>
        <div class="target-inspector-header">
          <strong id="target-inspector-title">Target detail</strong>
          <span id="target-inspector-status"></span>
        </div>
        <div class="target-comparison">
          <figure>
            <img id="target-preview" alt="Enlarged target pattern">
            <figcaption>Target</figcaption>
          </figure>
          <figure>
            <img id="current-preview" alt="Enlarged current result">
            <figcaption>Current</figcaption>
          </figure>
        </div>
        <p class="target-inspector-help">Tap here or anywhere outside to close. Press Escape to close with a keyboard.</p>
      </aside>
    </div>
  </main>
  <script src="./lightdiscs.js"></script>
</body>
</html>
