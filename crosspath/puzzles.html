<!-- Puzzle catalogue grouped by difficulty, with completion marks from local storage. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2ede1">
  <title>Puzzles | Crosspath</title>
  <!-- Shared stylesheet version query refreshes cached presentation. -->
  <link rel="stylesheet" href="./styles.css?v=20261018b">
</head>
<body>
  <main class="paper">
    <!-- puzzles.js fills the saved-completion tally in the compact masthead. -->
    <header class="masthead masthead-compact">
      <div class="masthead-row">
        <a class="back-link" href="./index.html" aria-label="Back to Crosspath menu">&#8592; Menu</a>
        <span class="masthead-name">Crosspath</span>
        <span class="solved-tally" id="solved-tally"></span>
      </div>
    </header>
    <div class="puzzle-heading">
      <p class="kicker">Puzzles</p>
      <h1>Choose a puzzle</h1>
      <p class="standfirst">Harder puzzles give fewer clues and offer more plausible-looking places for each piece. Solved puzzles are ticked.</p>
    </div>
    <!-- puzzles.js inserts labelled difficulty sections and numbered puzzle links here. -->
    <div class="difficulty-list" id="difficulty-list"></div>
  </main>
  <!-- Catalogue data and completion helpers precede the catalogue-building controller. -->
  <script src="./puzzle-levels.js"></script>
  <script src="./puzzle-progress.js"></script>
  <script src="./puzzles.js"></script>
</body>
</html>
